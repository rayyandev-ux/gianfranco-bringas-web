server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    etag on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /assets/ { try_files $uri =404; expires 30d; add_header Cache-Control "public, max-age=2592000" always; add_header X-Content-Type-Options nosniff always; add_header X-Robots-Tag "noindex, nofollow" always; }
    location ~* \.html$ { expires -1; add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; add_header X-Content-Type-Options nosniff always; }
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~ /\. { deny all; }
    location ~* \.(md|py)$ { deny all; }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
